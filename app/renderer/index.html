<script>(function(){const T0=Number(new URLSearchParams(location.search).get('t')||0);const c=document.getElementById('sky').getContext('2d');
let s=7;const r=()=>(s=(s*16807)%2147483647)/2147483647;const st=[];
for(let i=0;i<320;i++){const big=r()<.12;st.push({x:r()*1672,y:r()*760,z:big?1.1+r()*.9:.35+r()*.8,p:r()*6.28,v:big?.25+r()*.5:.6+r()*2,big,hue:r()});}

 for(const o of st){let a=.5+.5*Math.sin(t*o.v+o.p);

   c.fillStyle=g;c.beginPath();c.arc(o.x,o.y,o.z*7,0,7);c.fill();

<script>(function(){ // parallax: ratón + deriva lenta; las capas lejanas se mueven menos. Quieto hasta que se revela el launcher.
const L=[...document.querySelectorAll('.scene>[data-d]')]; let mx=0,my=0,cx=0,cy=0,st=null;
addEventListener('mousemove',e=>{if(st==null)return;mx=e.clientX/innerWidth*2-1;my=e.clientY/innerHeight*2-1;});
addEventListener('mouseleave',()=>{mx=0;my=0;});
window.sceneStart=()=>{st=performance.now();};
function f(n){const t=st==null?0:(n-st)/1000; cx+=(mx-cx)*.05; cy+=(my-cy)*.05;
 const ix=Math.sin(t*.13)*.25, iy=Math.cos(t*.11)*.18;
 const rot=Math.sin(t*.1)*3, dx=Math.sin(t*.08)*45, dy=Math.cos(t*.07)*20, zs=1.21+.03*Math.sin(t*.05);
 for(const el of L){const d=+el.dataset.d; let tr=`translate(${-(cx+ix)*d}px,${-(cy+iy)*d*.6}px)`;
  if(d<=14) tr+=` translate(${dx*(d/14)}px,${dy*(d/14)}px) rotate(${rot*(d===10?1:.7)}deg) scale(${zs})`;
  else tr+=` scale(${1.045+d*.0004})`;
  el.style.transform=tr;}
 requestAnimationFrame(f);} requestAnimationFrame(f);})();</script>
