name: Pruebas en Windows

# Se lanza a mano: compila el launcher como en la release y comprueba en Windows
#  - que encuentra el id de un perfil de Modrinth en app.db
#  - que el Java incluido en el .exe instala NeoForge sin ventanas
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Compilar y empaquetar
        shell: bash
        run: .github/scripts/build-launcher.sh 1.0.0 launcher-src/test/InstallTest.java launcher-src/test/ModrinthDbTest.java
      - name: Arrancador (launcher descargado)
        shell: bash
        run: |
          J="build/app/Derisomod Launcher/runtime/bin/java.exe"
          APP="$APPDATA/.derisomod-launcher/app"
          rm -rf "$APP"
          echo "--- sin descarga:"; "$J" -jar dist/Derisomod-Launcher.jar --version | tee out1.txt
          grep -q "Derisomod-Launcher.jar" out1.txt
          mkdir -p "$APP"; cp dist/Derisomod-Launcher.jar "$APP/launcher-new.jar"; echo 99.0.0 > "$APP/launcher-new.version"
          echo "--- con una version 99.0.0 descargada:"; "$J" -jar dist/Derisomod-Launcher.jar --version | tee out2.txt
          grep -q "derisomod-launcher/app/launcher.jar" out2.txt
          echo basura > "$APP/launcher.jar"
          echo "--- con la descargada rota:"; "$J" -jar dist/Derisomod-Launcher.jar --version | tee out3.txt
          grep -q "Derisomod-Launcher.jar" out3.txt
          test ! -f "$APP/launcher.jar"
          rm -rf "$APP"
      - name: Perfil de Modrinth (app.db)
        shell: bash
        run: '"build/app/Derisomod Launcher/runtime/bin/java.exe" -cp dist/Derisomod-Launcher.jar ModrinthDbTest'
      - name: Instalar NeoForge con el Java del .exe
        shell: bash
        run: |
          NEO=$(python -c "import json;print(json.load(open('manifest.json'))['neoforge'])")
          "build/app/Derisomod Launcher/runtime/bin/java.exe" -cp dist/Derisomod-Launcher.jar InstallTest "$NEO"
      - name: Registro del instalador
        if: always()
        shell: bash
        run: tail -n 40 "$APPDATA/.derisomod-launcher-cache/neoforge-install.log" || true
