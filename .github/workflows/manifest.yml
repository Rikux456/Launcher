name: Actualizar manifest

# Cada vez que cambias algo dentro de modpack/, regenera manifest.json
on:
  push:
    branches: [main]
    paths: ["modpack/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/generate_manifest.py
      - name: Guardar manifest.json
        run: |
          if git diff --quiet -- manifest.json; then
            echo "Sin cambios"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "Actualizar manifest.json"
          git push
