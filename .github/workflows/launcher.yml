name: Compilar launcher

# Cada vez que cambias launcher-src/ (o lo lanzas a mano desde Actions) compila el launcher
# y, si LAUNCHER_VERSION es nueva, lo publica en Releases como v<versión>:
#  - <Nombre>-Launcher-Windows.zip : carpeta con .exe y Java incluido (no hace falta instalar Java)
#  - <Nombre>-Launcher.jar         : para quien ya tenga Java 21 (Windows, Mac o Linux)
on:
  push:
    branches: [main]
    paths: ["launcher-src/**", ".github/workflows/launcher.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Leer versión
        id: ver
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'LAUNCHER_VERSION = "\K[0-9.]+' launcher-src/Launcher.java)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Compilar
        shell: bash
        run: |
          .github/scripts/build-launcher.sh "${{ steps.ver.outputs.version }}"
          cd build/app && 7z a ../../dist/Derisomod-Launcher-Windows.zip "Derisomod Launcher"
      - name: Publicar release
        if: steps.ver.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Launcher ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/Derisomod-Launcher-Windows.zip
            dist/Derisomod-Launcher.jar
      - name: Guardar como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: launcher
          path: dist/
