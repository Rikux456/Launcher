name: Compilar launcher

# Al subir un tag como v1.0.0 compila el launcher y lo publica en Releases:
#  - <Nombre>-Launcher-Windows.zip : carpeta con .exe y Java incluido (no hace falta instalar Java)
#  - <Nombre>-Launcher.jar         : para quien ya tenga Java 21 (Windows, Mac o Linux)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Compilar
        shell: bash
        run: |
          mkdir -p build/classes dist
          javac -encoding UTF-8 -d build/classes launcher-src/Launcher.java
          printf "Main-Class: Launcher\n" > build/manifest.txt
          jar cfm dist/Derisomod-Launcher.jar build/manifest.txt -C build/classes .
      - name: Crear .exe con Java incluido
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+)*$ ]] || VERSION="1.0.0"
          jpackage --type app-image --name "Derisomod Launcher" --app-version "$VERSION" \
            --input dist --main-jar Derisomod-Launcher.jar --main-class Launcher \
            --add-modules java.desktop,java.net.http --dest build/app
          cd build/app && 7z a ../../dist/Derisomod-Launcher-Windows.zip "Derisomod Launcher"
      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Derisomod-Launcher-Windows.zip
            dist/Derisomod-Launcher.jar
      - name: Guardar como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: launcher
          path: dist/
