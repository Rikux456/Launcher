#Guardia: manten click derecho con un arma. Bloquea golpes de frente gastando estamina.
#Parry: si el golpe llega justo al empezar la guardia y su dano <= tu ataque + Resistencia x resistanceFactor,
#se anula sin gastar casi estamina. Con Epic Fight instalado se usa su guardia/parry y esto no se aplica
#(salvo resistanceFactor, que tambien vale para el parry de Epic Fight).
[guard]
	enabled = true
	#Ticks desde que levantas la guardia en los que un golpe cuenta como parry (20 ticks = 1 s). Epic Fight usa 8.
	# Default: 6
	# Range: 1 ~ 40
	parryWindowTicks = 6
	#Cuanto suma cada punto del stat Resistencia al umbral de parry (tambien con Epic Fight)
	# Default: 1.0
	# Range: 0.0 ~ 100.0
	resistanceFactor = 1.0
	#Contra hechizos el umbral de parry (ataque + Resistencia) se multiplica por esto: con 0,5 solo se devuelven
	#hechizos de la mitad de fuerza que los golpes normales (tambien con Epic Fight)
	# Default: 0.5
	# Range: 0.0 ~ 10.0
	spellParryFactor = 0.5
	#Estamina que gasta un parry con exito
	# Default: 0.0
	# Range: 0.0 ~ 100.0
	parryStaminaCost = 0.0
	#Estamina que gasta bloquear por cada punto de dano del golpe
	# Default: 1.0
	# Range: 0.0 ~ 100.0
	staminaPerDamage = 1.0
	#Si te quedas sin estamina la guardia se rompe: recibes el golpe y no puedes guardar durante estos ticks
	# Default: 30
	# Range: 0 ~ 400
	guardBreakTicks = 30
	#Cuanto te frena ir en guardia (0,4 = 40% mas lento)
	# Default: 0.4
	# Range: 0.0 ~ 1.0
	moveSlowdown = 0.4
	#Si tambien se pueden bloquear/parry flechas y otros proyectiles
	allowProjectiles = true
	#Al hacerle parry, el atacante queda Aturdido (casi no se mueve ni hace dano) durante estos ticks (60 = 3 s; 0 = no)
	#Tambien con Epic Fight.
	# Default: 60
	# Range: 0 ~ 400
	staggerTicks = 60
	#El golpe tiene que venir de delante: angulo del cono en grados (180 = como Epic Fight, 360 = desde cualquier lado)
	# Default: 180.0
	# Range: 1.0 ~ 360.0
	facingAngle = 180.0

#Estamina (modo propio). Con Epic Fight se usa su barra; el stat Estamina tambien la mejora.
[stamina]
	#Estamina que se recupera por segundo cuando no estas en guardia
	# Default: 4.0
	# Range: 0.0 ~ 100.0
	regenPerSecond = 4.0
	#Ticks que espera tras gastar estamina antes de empezar a recuperarla
	# Default: 20
	# Range: 0 ~ 200
	regenDelayTicks = 20

#Correr por paredes y techo: esprinta hasta llenar el impulso y choca contra una pared.
#Te mueves hacia donde miras; saltar te suelta. Gasta estamina (la de Epic Fight si esta instalado).
[surface]
	enabled = true
	#Segundos esprintando para llenar el impulso (Velocidad lo reduce un 0,8% por punto, hasta un 60%)
	# Default: 2.0
	# Range: 0.2 ~ 20.0
	chargeSeconds = 2.0
	#Estamina por segundo mientras corres por una pared o el techo
	# Default: 3.0
	# Range: 0.0 ~ 100.0
	staminaPerSecond = 3.0
	#Estamina minima para poder engancharte
	# Default: 2.0
	# Range: 0.0 ~ 100.0
	minStaminaToStart = 2.0
	#Velocidad base por la superficie en bloques/tick (0,3 = 6 bloques/s). El bonus de sprint de Velocidad se suma
	# Default: 0.3
	# Range: 0.05 ~ 2.0
	speed = 0.3
	#Fuerza del salto para soltarte de la pared (hacia fuera)
	# Default: 0.75
	# Range: 0.0 ~ 5.0
	wallJumpOut = 0.75
	#Cuanto del salto va en la direccion en la que corrias
	# Default: 0.4
	# Range: 0.0 ~ 5.0
	wallJumpAlong = 0.4
	#Puntos invertidos en Velocidad necesarios para poder correr por paredes (10 = Velocidad 20).
	#Sin ellos el impulso no se carga.
	# Default: 10
	# Range: 0 ~ 89
	minSpeedPoints = 10
	#Puntos en Velocidad necesarios para pasar de la pared al techo (20 = Velocidad 30)
	# Default: 20
	# Range: 0 ~ 89
	minCeilingSpeedPoints = 20

#Aviso tipo Sekiro antes de que un mob te golpee (para calcular el parry).
#Funciona con mobs que usan la IA vanilla de cuerpo a cuerpo (zombis, aranas...) y arcos (esqueletos).
[warning]
	#Mandar el aviso a los jugadores
	enabled = true
	#Ticks de antelacion del aviso (20 = 1 s). Si el mob llega ya con el ataque cargado, avisa al acercarse.
	# Default: 8
	# Range: 2 ~ 20
	warnTicks = 8
	#Antelacion minima garantizada (ticks). Si un mob iba a pegar sin haber avisado (golpes muy
	#seguidos, llega corriendo...), avisa y retrasa el golpe este tiempo. 0 = no retrasar nunca.
	# Default: 6
	# Range: 0 ~ 20
	minLeadTicks = 6

#La Zona (tecla P): ralentiza todo lo que hay a tu alrededor. No gasta mana ni estamina:
#tiene una barra de duracion que se gasta mientras esta activa y se recarga sola.
#Nivel 1: todo lo de dentro va lento, tu tambien. Nivel 2: todo menos tu.
[zone]
	enabled = true
	#Nivel general necesario para aprender La Zona en el arbol de habilidades
	# Default: 35
	# Range: 1 ~ 250
	unlockLevel = 35
	#Puntos de habilidad que cuesta aprender La Zona
	# Default: 10
	# Range: 0 ~ 250
	unlockCost = 10
	#Nivel general para La Zona mejorada (tu vas a velocidad normal)
	# Default: 50
	# Range: 1 ~ 250
	upgradeLevel = 50
	#Radio de la zona en bloques (se mueve contigo)
	# Default: 12.0
	# Range: 2.0 ~ 48.0
	radius = 12.0
	#Nivel 1: velocidad de lo que esta dentro (0,2 = va al 20%)
	# Default: 0.2
	# Range: 0.01 ~ 0.95
	slowFactor = 0.2
	#Nivel 1: velocidad del propio jugador que la activa (un poco menos lento que el resto)
	# Default: 0.3
	# Range: 0.01 ~ 1.0
	ownerSlowFactor = 0.3
	#Nivel 2: velocidad de lo que esta dentro (0,05 = casi tiempo parado)
	# Default: 0.05
	# Range: 0.01 ~ 0.95
	slowFactorImproved = 0.05
	#Nivel 1: velocidad de los OTROS jugadores dentro de tu zona (0,5 = la mitad: un poco lentos)
	# Default: 0.5
	# Range: 0.01 ~ 1.0
	playerSlowFactor = 0.5
	#Nivel 2: velocidad de los OTROS jugadores dentro de tu zona (0,06 = casi parados)
	# Default: 0.06
	# Range: 0.01 ~ 1.0
	playerSlowFactorImproved = 0.06
	#Segundos que dura con la barra llena
	# Default: 6.0
	# Range: 0.5 ~ 120.0
	durationSeconds = 6.0
	#Segundos que tarda la barra en llenarse desde vacia
	# Default: 20.0
	# Range: 0.5 ~ 600.0
	rechargeSeconds = 20.0
	#Recarga con La Zona mejorada (un poco menos)
	# Default: 15.0
	# Range: 0.5 ~ 600.0
	rechargeSecondsImproved = 15.0
	#Dentro de una zona todos tus golpes son criticos: multiplicador en nivel 1 (vanilla = 1,5)
	# Default: 1.5
	# Range: 1.0 ~ 10.0
	critMultiplier = 1.5
	#Multiplicador del critico en nivel 2
	# Default: 2.0
	# Range: 1.0 ~ 10.0
	critMultiplierImproved = 2.0
	#Knockback de cada critico dado en la zona. Se acumula y sale todo junto cuando el
	#golpeado vuelve a moverse a velocidad normal (nivel 1 / nivel 2)
	# Default: 0.25
	# Range: 0.0 ~ 5.0
	critImpact = 0.25
	# Default: 0.4
	# Range: 0.0 ~ 5.0
	critImpactImproved = 0.4
	#Ventana de parry multiplicada dentro de una zona (nivel 1 / nivel 2)
	# Default: 2.0
	# Range: 1.0 ~ 20.0
	parryWindowMultiplier = 2.0
	# Default: 4.0
	# Range: 1.0 ~ 20.0
	parryWindowMultiplierImproved = 4.0
	#Golpe maximo que se puede parar (ataque + Resistencia) multiplicado dentro de una zona (nivel 1 / nivel 2)
	# Default: 1.5
	# Range: 1.0 ~ 20.0
	parryThresholdMultiplier = 1.5
	# Default: 3.0
	# Range: 1.0 ~ 20.0
	parryThresholdMultiplierImproved = 3.0

	#La Zona por instinto: se puede activar sola con poca vida y un mob hostil cerca.
	#Antes de aprenderla: nivel 1, dura menos y no se puede cortar. Tras activarse sola unas veces aparece
	#en el arbol de habilidades. Ya aprendida: se activa con la barra llena.
	[zone.instinct]
		#Probabilidad en cada comprobacion (0,07 = 7%)
		# Default: 0.07
		# Range: 0.0 ~ 1.0
		activationChance = 0.07
		#Segundos entre comprobaciones
		# Default: 5
		# Range: 1 ~ 600
		checkSeconds = 5
		#Vida maxima para que pueda saltar (3 = corazon y medio)
		# Default: 3.0
		# Range: 0.5 ~ 1000.0
		maxHealth = 3.0
		#Radio en bloques en el que tiene que haber un mob hostil
		# Default: 15.0
		# Range: 1.0 ~ 64.0
		hostileRadius = 15.0
		#Segundos que dura cuando salta sola antes de aprenderla
		# Default: 5.0
		# Range: 0.5 ~ 60.0
		durationSeconds = 5.0
		#Veces que tiene que saltar sola para que aparezca en el arbol de habilidades
		# Default: 4
		# Range: 1 ~ 100
		timesToReveal = 4

#Auto-esquivar (siempre activo, antes que la guardia): probabilidad segun Velocidad y Estamina
#y el dano del golpe; mucho mayor dentro de La Zona.
[dodge]
	enabled = true
	#% de esquivar por punto de Velocidad
	# Default: 0.6
	# Range: 0.0 ~ 5.0
	chancePerSpeedPoint = 0.6
	#% de esquivar por punto de Estamina
	# Default: 0.3
	# Range: 0.0 ~ 5.0
	chancePerStaminaPoint = 0.3
	#Probabilidad maxima fuera de La Zona (0,85 = 85%)
	# Default: 0.85
	# Range: 0.0 ~ 1.0
	chanceCap = 0.85
	#Multiplicador dentro de La Zona nivel 1
	# Default: 1.6
	# Range: 1.0 ~ 20.0
	zoneChanceMultiplier = 1.6
	#Probabilidad maxima dentro de La Zona nivel 1 (en nivel 2 el tope es 100%)
	# Default: 0.95
	# Range: 0.0 ~ 1.0
	zoneChanceCap = 0.95
	#Multiplicador dentro de La Zona nivel 2
	# Default: 3.0
	# Range: 1.0 ~ 20.0
	zoneChanceMultiplierImproved = 3.0
	#Estamina que gasta cada esquiva
	# Default: 3.0
	# Range: 0.0 ~ 100.0
	staminaCost = 3.0

#Hechizos (tecla G lanza el elegido en la rueda; manten C para la rueda). Gastan mana.
#El dano se multiplica por la proficiencia del elemento: de proficiencyMinMultiplier (0 %) a proficiencyMaxMultiplier (100 %).
#Con 50 % (el elemento de origen) el multiplicador es la media de los dos.
[spells]
	#Mana que se recupera por segundo, en % del mana maximo (5 = se llena en 20 s)
	# Default: 5.0
	# Range: 0.0 ~ 100.0
	manaRegenPercentPerSecond = 5.0
	#Ticks que espera tras lanzar un hechizo antes de recuperar mana
	# Default: 20
	# Range: 0 ~ 400
	manaRegenDelayTicks = 20
	#Ticks entre un hechizo y el siguiente
	# Default: 10
	# Range: 0 ~ 400
	castCooldownTicks = 10
	#Multiplicador de dano con 0 % de proficiencia
	# Default: 0.5
	# Range: 0.0 ~ 10.0
	proficiencyMinMultiplier = 0.5
	#Multiplicador de dano con 100 % de proficiencia
	# Default: 1.5
	# Range: 0.0 ~ 10.0
	proficiencyMaxMultiplier = 1.5
	#Si las explosiones de los hechizos rompen bloques
	breakBlocks = false
	#Proficiencia (%) que necesitas en un elemento para tener la inspiracion y poder combinarlo
	#con una habilidad (p. ej. Fulgur con Bola de fuego)
	# Default: 30
	# Range: 0 ~ 100
	combineProficiency = 30

	#Carga y sobrecarga: con el hechizo en la mano, manten click derecho. Si sueltas antes de chargeTicks no sale
	#nada (ni gasta mana). Con la carga completa, tras overchargeDelayTicks empieza la sobrecarga, que tarda
	#overchargeTicks en llenarse: si sueltas antes de que se llene sale normal; despues, sobrecargado.
	[spells.charge]
		#Ticks de carga para poder lanzar (20 = 1 s)
		# Default: 12
		# Range: 0 ~ 400
		chargeTicks = 12
		#Ticks que hay que seguir manteniendo con la carga completa antes de que empiece la sobrecarga
		# Default: 40
		# Range: 0 ~ 1200
		overchargeDelayTicks = 40
		#Ticks que tarda en llenarse la sobrecarga (despues de la espera)
		# Default: 60
		# Range: 1 ~ 1200
		overchargeTicks = 60
		#Cuanto te frena cargar un hechizo (0,5 = 50% mas lento)
		# Default: 0.5
		# Range: 0.0 ~ 1.0
		moveSlowdown = 0.5

	[spells.fireball]
		#Mana que gasta la Bola de fuego
		# Default: 6
		# Range: 0 ~ 1000
		manaCost = 6
		#Dano de la explosion en el centro (en medios corazones), antes del multiplicador de proficiencia de Ignis
		# Default: 8.0
		# Range: 0.0 ~ 1000.0
		damage = 8.0
		#Radio de la explosion (bloques). El dano baja hasta 2/3 en el borde
		# Default: 3.0
		# Range: 0.5 ~ 16.0
		radius = 3.0
		#Velocidad (bloques por tick; 1,1 = 22 bloques por segundo)
		# Default: 1.1
		# Range: 0.1 ~ 5.0
		speed = 1.1
		#Ticks que vuela antes de explotar sola en el aire
		# Default: 60
		# Range: 5 ~ 400
		lifeTicks = 60
		#Segundos que arden los alcanzados
		# Default: 3
		# Range: 0 ~ 60
		fireSeconds = 3
		#Sobrecargada (cupula de fuego): mana que gasta
		# Default: 15
		# Range: 0 ~ 1000
		overManaCost = 15
		#Sobrecargada: dano en el centro (2/3 en el borde), antes del multiplicador de proficiencia
		# Default: 20.0
		# Range: 0.0 ~ 1000.0
		overDamage = 20.0
		#Sobrecargada: radio de la cupula (bloques)
		# Default: 5.0
		# Range: 0.5 ~ 32.0
		overRadius = 5.0
		#Sobrecargada: rompe bloques como una explosion
		overBreakBlocks = true
		#Sobrecargada: ticks que la cupula de fuego admite combos (Tajo de viento -> torbellino de fuego; Luz -> cruz de llamas doradas; Terra -> erupcion de magma...); la cupula se ve mientras tanto
		# Default: 90
		# Range: 0 ~ 400
		domeComboTicks = 90
		#Sobrecargada: fuerza de la explosion para romper bloques (creeper = 3, TNT = 4)
		# Default: 3.0
		# Range: 0.0 ~ 20.0
		overBlockPower = 3.0

	[spells.fireball_lightning]
		#Mana que gasta la Bola de fuego electrificada
		# Default: 10
		# Range: 0 ~ 1000
		manaCost = 10
		#Dano del rayo que salta a cada enemigo cercano, antes del multiplicador de proficiencia de Fulgur
		#(la explosion hace el mismo dano que la Bola de fuego)
		# Default: 5.0
		# Range: 0.0 ~ 1000.0
		chainDamage = 5.0
		#Distancia maxima a la que salta el rayo (bloques)
		# Default: 6.0
		# Range: 1.0 ~ 32.0
		chainRange = 6.0
		#A cuantos enemigos salta como mucho
		# Default: 3
		# Range: 0 ~ 16
		chainTargets = 3
		#Sobrecargada: mana que gasta la electrificada
		# Default: 22
		# Range: 0 ~ 1000
		overManaCost = 22
		#Sobrecargada: dano del rayo a cada enemigo
		# Default: 10.0
		# Range: 0.0 ~ 1000.0
		overChainDamage = 10.0
		#Sobrecargada: a cuantos enemigos salta el rayo
		# Default: 5
		# Range: 0 ~ 32
		overChainTargets = 5
		#Ticks que quedan aturdidos (muy lentos) los alcanzados por el rayo
		# Default: 20
		# Range: 0 ~ 200
		stunTicks = 20

	[spells.fireball_wind]
		#Mana que gasta la Bola de fuego + Ventus (la explosion hace el mismo dano que la Bola de fuego)
		# Default: 8
		# Range: 0 ~ 1000
		manaCost = 8
		#Radio de la rafaga que aleja a los enemigos al explotar (bloques)
		# Default: 6.0
		# Range: 0.0 ~ 32.0
		gustRadius = 6.0
		#Fuerza del empujon de la rafaga (en el centro; la mitad en el borde)
		# Default: 1.6
		# Range: 0.0 ~ 10.0
		gustStrength = 1.6
		#Sobrecargada (torbellino de fuego): mana que gasta
		# Default: 18
		# Range: 0 ~ 1000
		overManaCost = 18
		#Torbellino: dano cada medio segundo a los atrapados, antes del multiplicador de proficiencia de Ventus
		# Default: 3.0
		# Range: 0.0 ~ 1000.0
		tornadoDamage = 3.0
		#Torbellino: radio en el que atrapa (bloques)
		# Default: 5.0
		# Range: 0.5 ~ 32.0
		tornadoRadius = 5.0
		#Torbellino: ticks que dura (al acabar suelta a los atrapados lanzandolos hacia fuera). Tambien es lo que dura el tornado de viento al prenderlo con una Bola de fuego
		# Default: 120
		# Range: 10 ~ 600
		tornadoTicks = 120
		#Torbellino: fuerza con la que atrae y levanta
		# Default: 0.22
		# Range: 0.0 ~ 2.0
		tornadoPull = 0.22

	[spells.fireball_earth]
		#Mana que gasta la Bola de fuego + Terra (la explosion hace el mismo dano que la Bola de fuego)
		# Default: 8
		# Range: 0 ~ 1000
		manaCost = 8
		#Charco de lava: dano cada medio segundo a quien lo pisa, antes del multiplicador de proficiencia de Terra
		#(solo es el efecto: no pone bloques de lava)
		# Default: 2.0
		# Range: 0.0 ~ 1000.0
		poolDamage = 2.0
		#Ticks que dura el charco de lava
		# Default: 80
		# Range: 0 ~ 600
		poolTicks = 80
		#Sobrecargada (erupcion de magma): mana que gasta. Rompe bloques como la cupula (fireball.overBreakBlocks)
		# Default: 18
		# Range: 0 ~ 1000
		overManaCost = 18
		#Sobrecargada: dano de los pinchos de roca a quien esta en la zona, antes del multiplicador de Terra
		# Default: 6.0
		# Range: 0.0 ~ 1000.0
		spikeDamage = 6.0
		#Sobrecargada: fuerza con la que los pinchos lanzan hacia arriba
		# Default: 0.9
		# Range: 0.0 ~ 5.0
		spikeLaunch = 0.9
		#Sobrecargada: ticks que dura el charco de lava grande
		# Default: 120
		# Range: 0 ~ 600
		overPoolTicks = 120

	[spells.fireball_light]
		#Mana que gasta la Bola de fuego + Luminis (sale una bola guiada por cada enemigo marcado; sin marcas no se lanza)
		# Default: 8
		# Range: 0 ~ 1000
		manaCost = 8
		#Enemigos que se pueden marcar como mucho mientras cargas (mirandolos)
		# Default: 3
		# Range: 1 ~ 16
		maxTargets = 3
		#Distancia a la que se marca a un enemigo al mirarlo mientras cargas (bloques)
		# Default: 32.0
		# Range: 4.0 ~ 128.0
		targetRange = 32.0
		#Cuanto gira la bola hacia su objetivo cada tick (0 = nada, 1 = de golpe)
		# Default: 0.25
		# Range: 0.0 ~ 1.0
		homing = 0.25
		#Multiplicador de dano de la luz contra muertos vivientes (zombis, esqueletos...)
		# Default: 1.5
		# Range: 1.0 ~ 10.0
		undeadMultiplier = 1.5
		#Sobrecargada (cruz de llamas doradas, cae donde apuntas, no necesita marcas): mana que gasta. No rompe bloques
		# Default: 18
		# Range: 0 ~ 1000
		overManaCost = 18
		#Cruz: radio del circulo (bloques)
		# Default: 5.5
		# Range: 0.5 ~ 32.0
		crossRadius = 5.5
		#Cruz: dano cada medio segundo a los del circulo, antes del multiplicador de proficiencia de Luminis
		# Default: 3.0
		# Range: 0.0 ~ 1000.0
		crossDamage = 3.0
		#Cruz: ticks que quema a los del circulo
		# Default: 60
		# Range: 0 ~ 400
		crossTicks = 60

	[spells.fireball_water]
		#Mana que gasta la Bola de fuego + Aqua (la explosion hace el mismo dano que la Bola de fuego, quema y ciega)
		# Default: 8
		# Range: 0 ~ 1000
		manaCost = 8
		#Segundos de ceguera a los alcanzados por la explosion de vapor
		# Default: 3
		# Range: 0 ~ 60
		blindSeconds = 3
		#Sobrecargada (columna de energia y vapor): mana que gasta. Rompe bloques como la cupula (fireball.overBreakBlocks)
		# Default: 18
		# Range: 0 ~ 1000
		overManaCost = 18
		#Sobrecargada: radio de la onda expansiva, que empuja hacia fuera y ciega (bloques)
		# Default: 12.0
		# Range: 0.0 ~ 48.0
		waveRadius = 12.0
		#Sobrecargada: fuerza del empujon de la onda (en el centro; la mitad en el borde)
		# Default: 1.4
		# Range: 0.0 ~ 10.0
		waveStrength = 1.4
		#Sobrecargada: segundos de ceguera de la onda
		# Default: 5
		# Range: 0 ~ 60
		overBlindSeconds = 5

	[spells.fireball_dark]
		#Mana que gasta la Bola de fuego + Obscuritas (la explosion hace el mismo dano que la Bola de fuego y aplica llamas negras)
		# Default: 8
		# Range: 0 ~ 1000
		manaCost = 8
		#Llamas negras: segundos que duran (no se apagan con agua y mientras duran no se puede curar)
		# Default: 5
		# Range: 1 ~ 120
		blackFlameSeconds = 5
		#Llamas negras: dano por segundo (x1 / x1,5 / x2 segun la proficiencia en Obscuritas del lanzador)
		# Default: 1.0
		# Range: 0.0 ~ 100.0
		blackFlameDamage = 1.0
		#Sobrecargada (fauces): mana que gasta. El mordisco hace el dano de sobrecarga; no rompe bloques
		# Default: 18
		# Range: 0 ~ 1000
		overManaCost = 18
		#Sobrecargada: radio de la onda de llamas negras que sale del mordisco (bloques)
		# Default: 5.0
		# Range: 0.0 ~ 32.0
		biteRadius = 5.0

	[spells.fireball_ether]
		#Mana que gasta la Bola de fuego + Ether (llama del eter)
		# Default: 10
		# Range: 0 ~ 1000
		manaCost = 10
		#Dano del golpe (x la proficiencia en Ignis). Si mata al objetivo, este se desintegra como un papel que arde
		# Default: 24.0
		# Range: 0.0 ~ 10000.0
		damage = 24.0
		#Sobrecargada (zona que lo borra todo): mana que gasta
		# Default: 40
